<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>PinkFlix</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>Pink<span>Flix</span></h1>

    <div class="controls">
        <input id="search" placeholder="Пошук серіалів..." />

        <select id="genre">
            <option value="all">Усі жанри</option>
        </select>

        <select id="sort">
            <option value="default">Сортування</option>
            <option value="rating">Рейтинг ↓</option>
            <option value="name">Назва A-Z</option>
        </select>
    </div>
</header>

<main>
    <div id="error"></div>
    <div id="grid"></div>
</main>

<script src="app.js"></script>
</body>
</html>
